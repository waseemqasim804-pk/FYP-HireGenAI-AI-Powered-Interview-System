server {
    listen 80;
    server_name hiregen-ai.moo.com 20.98.82.167;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hiregen-ai.moo.com 20.98.82.167;

    # Self-signed SSL certificates
    ssl_certificate /etc/nginx/ssl/hiregen.crt;
    ssl_certificate_key /etc/nginx/ssl/hiregen.key;

    # Frontend - Serve React App
    location / {
        root /var/www/hiregen-frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Backend API endpoints
    location ~ ^/(upload-resume|report_status|reset-session|download-resume|download_report_file|health|docs) {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
